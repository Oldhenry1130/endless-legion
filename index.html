<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}*,*::before,*::after{box-sizing:border-box}</style>
<title>無盡軍團</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: full-screen canvas battlefield; in-run HUD pinned to the corners; meta screens (hub, levels, base, squads, results) as glass panels over the live scene. Single committed dark-arcade look. */
:root {
  --deep: #0b1020;
  --panel: rgba(13, 18, 34, .92);
  --panel-2: #182039;
  --line: rgba(255, 255, 255, .09);
  --paper: #ffffff;
  --muted: rgba(255, 255, 255, .62);
  --gold: #ffd23f;
  --gold-deep: #b98500;
  --cyan: #4df3ff;
  --good: #22c55e;
  --amber: #f59e0b;
  --bad: #ef4444;
  --f-display: "Bungee", "Noto Sans TC", system-ui, sans-serif;
  --f-body: "Noto Sans TC", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; overflow: hidden; }
[hidden] { display: none !important; }
body { background: var(--deep); color: var(--paper); font-family: var(--f-body); user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; }
#wrap { position: relative; height: 100%; overflow: hidden; }
#game { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff6c2 0 18%, #ffd23f 40%, #c98a00 100%); box-shadow: inset 0 0 0 .09em #8a5a00; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* ---------- in-run HUD ---------- */
.hud-top { position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.hud-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hud-col.right { align-items: flex-end; }
.lvl-card { background: rgba(10, 14, 28, .72); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px 10px; width: clamp(170px, 44vw, 270px); }
.lvl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; }
.lvl-head b { font-weight: 900; letter-spacing: .06em; }
.lvl-head span { color: var(--muted); font-size: 12px; }
.prog { position: relative; height: 10px; margin-top: 7px; border-radius: 5px; overflow: hidden; display: flex; background: rgba(255,255,255,.08); }
.prog .z { height: 100%; }
.prog .z0 { width: 60%; background: rgba(34,197,94,.28); }
.prog .z1 { width: 20%; background: rgba(245,158,11,.32); }
.prog .z2 { width: 20%; background: rgba(239,68,68,.36); }
#progFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, rgba(255,255,255,.55), rgba(255,255,255,.9)); }
.prog-row { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: var(--muted); }
.prog-row .num { color: var(--paper); font-size: 13px; }
#hZone { font-weight: 900; }
#hZone.z0 { color: #7dffa6; } #hZone.z1 { color: #ffc861; } #hZone.z2 { color: #ff7a7a; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(10, 14, 28, .72); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.pill b { font-family: var(--f-display); font-weight: 400; color: var(--gold); }
.pill.coins { font-size: 15px; }
.pill.buff b { color: #8fe9ff; }
.pill.buff.air b { color: #ffc861; }
.chip-stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.icon-btn { pointer-events: auto; appearance: none; border: 1px solid var(--line); background: rgba(10,14,28,.72); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
.icon-btn:focus-visible, .btn:focus-visible, .lv:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }

#bossbar { position: absolute; left: 50%; transform: translateX(-50%); top: calc(118px + env(safe-area-inset-top, 0px)); width: min(70%, 380px); pointer-events: none; }
#bossbar .label { font-family: var(--f-display); font-size: 12px; letter-spacing: .14em; text-align: center; text-shadow: 0 2px 0 #000; margin-bottom: 4px; }
#bossbar .track { height: 12px; border-radius: 6px; background: rgba(10,14,28,.8); overflow: hidden; border: 2px solid #000; }
#bossfill { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b3b, #ff9a3d); }

#banner { position: absolute; left: 0; right: 0; top: 32%; text-align: center; pointer-events: none; font-family: var(--f-display); font-size: clamp(32px, 8.5vw, 60px);
  color: var(--gold); letter-spacing: .04em; text-shadow: 0 4px 0 #000, 0 0 26px rgba(255,210,63,.55); animation: pop 1.8s ease-out both; }
#banner.amber { color: #ffc861; text-shadow: 0 4px 0 #000, 0 0 26px rgba(245,158,11,.7); }
#banner.sky { color: #8fe9ff; text-shadow: 0 4px 0 #000, 0 0 26px rgba(77,243,255,.75); }
#banner.red { color: #ff6b6b; text-shadow: 0 4px 0 #000, 0 0 26px rgba(239,68,68,.8); }
@keyframes pop { 0% { transform: scale(.4); opacity: 0 } 15% { transform: scale(1.12); opacity: 1 } 25% { transform: scale(1) } 80% { opacity: 1 } 100% { opacity: 0; transform: translateY(-20px) } }

/* ---------- ultimate: 天罰降臨 ---------- */
.ult-btn { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 92px; height: 92px; border-radius: 50%;
  appearance: none; border: 0; padding: 0; cursor: pointer; background: radial-gradient(circle at 50% 40%, #1d2a52, #0a0f22 70%); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.ult-ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ult-ring circle { fill: none; stroke-width: 7; }
.ult-ring .trk { stroke: rgba(255,255,255,.1); }
.ult-ring .val { stroke: url(#ultGrad); stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: 276.46; transition: stroke-dashoffset .2s linear; }
.ult-spin { position: absolute; inset: -7px; border-radius: 50%; opacity: 0; background: conic-gradient(from 0deg, transparent 0 60%, rgba(77,243,255,.9) 75%, #fff 80%, rgba(255,210,63,.9) 88%, transparent 100%);
  -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%, #000 70%, transparent 72%); mask: radial-gradient(circle, transparent 60%, #000 62%, #000 70%, transparent 72%); }
.ult-icon { position: absolute; left: 50%; top: 42%; width: 30px; height: 30px; transform: translate(-50%, -50%); fill: rgba(255,255,255,.35); transition: fill .2s; }
.ult-pct { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font-family: var(--f-display); font-size: 12px; color: var(--muted); }
.ult-name { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); white-space: nowrap; font-weight: 900; font-size: 12px; letter-spacing: .2em; color: var(--muted); text-shadow: 0 2px 4px #000; }
.ult-btn.ready { box-shadow: 0 0 0 2px rgba(255,210,63,.6), 0 0 28px rgba(77,243,255,.75), 0 6px 20px rgba(0,0,0,.5); animation: ultbeat 1.1s ease-in-out infinite; }
.ult-btn.ready .ult-spin { opacity: 1; animation: spin 1.2s linear infinite; }
.ult-btn.ready .ult-icon { fill: #fff; filter: drop-shadow(0 0 6px var(--cyan)); }
.ult-btn.ready .ult-pct, .ult-btn.ready .ult-name { color: var(--gold); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes ultbeat { 50% { transform: scale(1.07); } }
#ultTitle { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
#ultTitle .ut-kicker { font-family: var(--f-display); font-size: clamp(12px, 3vw, 16px); letter-spacing: .6em; color: var(--cyan); text-shadow: 0 0 12px rgba(77,243,255,.9); animation: utk 1.9s ease-out both; }
#ultTitle .ut-name { font-weight: 900; font-size: clamp(56px, 15vw, 128px); line-height: 1.05; letter-spacing: .08em; transform: skewX(-8deg);
  background: linear-gradient(180deg, #ffffff 10%, #fff2a8 45%, #ffb020 70%, #ff5a1f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 18px rgba(255,190,60,.9)) drop-shadow(0 6px 0 rgba(0,0,0,.7)); animation: utn 1.9s cubic-bezier(.2,.9,.2,1) both; }
#ultTitle .ut-slash { height: 4px; margin: 10px auto 0; width: min(80vw, 640px); background: linear-gradient(90deg, transparent, #fff, var(--cyan), transparent); box-shadow: 0 0 16px var(--cyan); animation: uts 1.9s ease-out both; }
@keyframes utn { 0% { opacity: 0; transform: skewX(-8deg) scale(2.6); filter: blur(12px) } 14% { opacity: 1; transform: skewX(-8deg) scale(.94); filter: drop-shadow(0 0 18px rgba(255,190,60,.9)) } 22% { transform: skewX(-8deg) scale(1.03) } 30%, 78% { transform: skewX(-8deg) scale(1); opacity: 1 } 100% { opacity: 0; transform: skewX(-8deg) scale(1.15) } }
@keyframes utk { 0%, 10% { opacity: 0; letter-spacing: 1.4em } 28%, 78% { opacity: 1; letter-spacing: .6em } 100% { opacity: 0 } }
@keyframes uts { 0%, 12% { transform: scaleX(0) } 32% { transform: scaleX(1) } 78% { opacity: 1 } 100% { opacity: 0; transform: scaleX(1.2) } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: auto;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(6,9,20,.35), rgba(6,9,20,.82)); }
.panel { width: min(100%, 760px); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.panel.narrow { width: min(100%, 420px); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.panel-head h2 { margin: 0; font-weight: 900; font-size: 24px; letter-spacing: .1em; text-wrap: balance; }
.panel-head .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.btn { appearance: none; border: 0; cursor: pointer; font-weight: 900; letter-spacing: .08em; border-radius: 14px; padding: 12px 16px; font-size: 16px; transition: transform .08s, box-shadow .08s, filter .15s; }
.btn:active { transform: translateY(3px); }
.btn.primary { background: linear-gradient(180deg, #ffe066, #ffc21a); color: #2a1d00; box-shadow: 0 5px 0 var(--gold-deep), 0 10px 24px rgba(255,190,40,.25); }
.btn.primary:active { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.ghost { background: rgba(255,255,255,.07); border: 1px solid var(--line); }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 11px; }
.btn[disabled] { filter: grayscale(1) brightness(.6); cursor: not-allowed; transform: none; }

/* hub */
.hub { flex-direction: column; justify-content: space-between; align-items: stretch; background: linear-gradient(180deg, rgba(6,9,20,.78) 0%, rgba(6,9,20,0) 34%, rgba(6,9,20,0) 58%, rgba(6,9,20,.88) 100%); }
.hub-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.hub-title { text-align: center; margin-top: 4vh; }
.hub-title .kicker { font-family: var(--f-display); letter-spacing: .5em; font-size: 13px; color: var(--cyan); text-shadow: 0 0 10px rgba(77,243,255,.6); }
.hub-title h1 { margin: 6px 0 0; font-weight: 900; font-size: clamp(48px, 13vw, 92px); line-height: 1; letter-spacing: .1em; transform: skewX(-6deg);
  background: linear-gradient(180deg, #fff 15%, #ffe680 55%, #ffae1a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 5px 0 rgba(0,0,0,.65)); }
.hub-title .squad-name { margin-top: 10px; font-size: 14px; color: var(--muted); letter-spacing: .12em; }
.hub-actions { display: flex; flex-direction: column; gap: 12px; width: min(100%, 460px); margin: 0 auto; }
.hub-actions .btn.primary { font-size: 22px; padding: 16px; }
.hub-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; background: rgba(13,18,34,.85); border: 1px solid var(--line); border-radius: 14px; }
.tile-btn svg { width: 26px; height: 26px; fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile-btn span { font-size: 14px; letter-spacing: .12em; }

/* levels */
.world { margin-top: 14px; }
.world:first-of-type { margin-top: 0; }
.world-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.world-head b { font-weight: 900; letter-spacing: .1em; }
.world-head span { color: var(--muted); font-size: 12px; }
.lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv { position: relative; appearance: none; border: 1px solid rgba(255,255,255,.14); border-radius: 12px; aspect-ratio: 1 / .92; max-width: 100%; cursor: pointer; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
.lv .n { font-family: var(--f-display); font-size: clamp(18px, 5vw, 26px); }
.lv .b { font-size: 11px; font-variant-numeric: tabular-nums; opacity: .9; }
.lv .ck { position: absolute; top: 5px; right: 5px; width: 18px; height: 18px; border-radius: 50%; background: var(--good); display: grid; place-items: center; }
.lv .ck svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; }
.lv.next { box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(255,210,63,.55); }
.lv.locked { cursor: not-allowed; filter: grayscale(.9) brightness(.45); }
.lv.locked svg.lock { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }

/* base */
.base-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.bld { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bld-top { display: flex; gap: 10px; align-items: center; }
.bld-ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; background: linear-gradient(160deg, #2c3b69, #151d36); border: 1px solid rgba(255,255,255,.12); }
.bld-ico svg { width: 26px; height: 26px; fill: none; stroke: var(--gold); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bld-name { font-weight: 900; letter-spacing: .06em; }
.bld-lv { font-size: 12px; color: var(--muted); }
.pips { display: flex; gap: 3px; }
.pips i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); }
.pips i.on { background: linear-gradient(90deg, #ffd23f, #ffae1a); }
.bld-stat { font-size: 13px; color: var(--muted); }
.bld-stat b { color: var(--paper); font-weight: 700; }
.bld-stat .to { color: #7dffa6; }
.bld .btn { display: flex; align-items: center; justify-content: center; gap: 6px; }

/* squads */
.sq-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.sq { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.sq.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(255,210,63,.25); }
.sq canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; border-radius: 10px; background: radial-gradient(ellipse at 50% 80%, #2b3a63, #121a31); display: block; }
.sq-name { font-weight: 900; letter-spacing: .06em; }
.sq-desc { font-size: 12px; color: var(--muted); min-height: 2.6em; line-height: 1.3; }
.sq .btn { display: flex; align-items: center; justify-content: center; gap: 6px; }

/* result */
.res-title { text-align: center; font-weight: 900; font-size: 34px; letter-spacing: .12em; margin: 2px 0 4px; }
.res-title.win { color: var(--gold); text-shadow: 0 0 20px rgba(255,210,63,.5); }
.res-title.lose { color: #ff6b6b; }
.res-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.res-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.res-stats div { background: rgba(255,255,255,.05); border-radius: 12px; padding: 8px 4px; text-align: center; }
.res-stats .k { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.res-stats .v { font-family: var(--f-display); font-size: 20px; }
.ledger { display: flex; flex-direction: column; gap: 6px; background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
.ledger div { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.ledger div b { color: var(--paper); font-family: var(--f-display); font-weight: 400; }
.ledger .total { border-top: 1px solid var(--line); padding-top: 6px; color: var(--paper); font-weight: 900; }
.ledger .total b { color: var(--gold); font-size: 18px; display: inline-flex; align-items: center; gap: 6px; }
.res-actions { display: grid; gap: 10px; }
.res-actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tagline { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; background: var(--gold); color: #2a1d00; margin-left: 6px; vertical-align: middle; }
@media (prefers-reduced-motion: reduce) { #banner, .ult-btn.ready, .ult-btn.ready .ult-spin, #ultTitle * { animation: none !important; } }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="hud-col">
        <div class="lvl-card">
          <div class="lvl-head"><b id="hLevel">第 1 關</b><span id="hTheme">翠綠平原</span></div>
          <div class="prog"><i class="z z0"></i><i class="z z1"></i><i class="z z2"></i><i id="progFill"></i></div>
          <div class="prog-row"><span><span class="num" id="hDist">0</span> / 5000 m</span><span id="hZone" class="z0">普通</span></div>
        </div>
        <div class="pill coins"><i class="coin"></i><b id="hCoins">0</b></div>
      </div>
      <div class="hud-col right">
        <button class="icon-btn" data-act="pause" type="button" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
        <div class="pill">武器 <b id="wname">手槍</b></div>
        <div class="chip-stats">
          <div class="pill">火力 <b id="wpow">×1</b></div>
          <div class="pill">射速 <b id="wrate">×1</b></div>
          <div class="pill">射程 <b id="wrange">×1</b></div>
        </div>
        <div class="chip-stats" id="buffs"></div>
      </div>
    </div>
    <div id="bossbar" hidden><div class="label" id="bosslabel">BOSS</div><div class="track"><i id="bossfill"></i></div></div>
    <button id="ultBtn" class="ult-btn" data-act="ult" type="button" aria-label="施放天罰降臨">
      <svg class="ult-ring" viewBox="0 0 100 100"><defs><linearGradient id="ultGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4df3ff"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs><circle class="trk" cx="50" cy="50" r="44"/><circle class="val" id="ultArc" cx="50" cy="50" r="44"/></svg>
      <span class="ult-spin"></span>
      <svg class="ult-icon" viewBox="0 0 24 24"><path d="M13.5 1.5 4 14h6.5L9 22.5 19.5 9H13z"/></svg>
      <span class="ult-pct" id="ultPct">0%</span>
      <span class="ult-name">天罰降臨</span>
    </button>
  </div>
  <div id="banner" hidden></div>
  <div id="ultTitle" hidden><div class="ut-kicker">JUDGMENT · ULTIMATE</div><div class="ut-name">天罰降臨</div><div class="ut-slash"></div></div>

  <!-- hub -->
  <div class="screen hub" id="scrHub" hidden>
    <div class="hub-top">
      <div class="pill coins"><i class="coin"></i><b id="hubCoins">0</b></div>
      <div class="pill">已通關 <b id="hubCleared">0</b> / 20</div>
    </div>
    <div class="hub-title">
      <div class="kicker">LEGION RUSH</div>
      <h1>無盡軍團</h1>
      <div class="squad-name" id="hubSquad">藍鷹步兵團</div>
    </div>
    <div class="hub-actions">
      <button class="btn primary" data-act="play" id="hubPlay" type="button">出征 · 第 1 關</button>
      <div class="hub-row">
        <button class="btn tile-btn" data-act="levels" type="button"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg><span>關卡</span></button>

];

const ICON = {
  barracks: '<path d="M3 21h18M5 21V11l7-6 7 6v10M10 21v-5h4v5"/><path d="M12 5V2l4 1.4L12 4.8"/>',
  armory: '<rect x="4" y="9" width="4" height="11" rx="2"/><rect x="10" y="5" width="4" height="15" rx="2"/><rect x="16" y="9" width="4" height="11" rx="2"/>',

};
const BUILDINGS = [
  { key: 'barracks', name: '兵營',     stat: '起始兵力', max: 10, cost: l => 80 * Math.pow(1.45, l),  val: l => 5 + 4 * l,     show: v => v + ' 人' },
  { key: 'armory',   name: '軍火庫',   stat: '武器火力', max: 10, cost: l => 100 * Math.pow(1.5, l), val: l => 1 + 0.12 * l,  show: v => '×' + v.toFixed(2) },
  { key: 'drill',    name: '訓練場',   stat: '射擊速度', max: 10, cost: l => 100 * Math.pow(1.5, l), val: l => 1 + 0.08 * l,  show: v => '×' + v.toFixed(2) },
  { key: 'tower',    name: '瞭望塔',   stat: '射擊距離', max: 8,  cost: l => 90 * Math.pow(1.45, l),  val: l => 1 + 0.08 * l,  show: v => '×' + v.toFixed(2) },
  { key: 'plate',    name: '防具工廠', stat: '受傷減免', max: 10, cost: l => 120 * Math.pow(1.5, l), val: l => 0.04 * l,      show: v => Math.round(v * 100) + '%' },
  { key: 'reactor',  name: '能量核心', stat: '天罰充能', max: 8,  cost: l => 120 * Math.pow(1.5, l), val: l => 1 + 0.1 * l,   show: v => '×' + v.toFixed(1) },
  { key: 'vault',    name: '金庫',     stat: '獎金加成', max: 10, cost: l => 150 * Math.pow(1.45, l), val: l => 1 + 0.1 * l,   show: v => '×' + v.toFixed(1) },
  { key: 'workshop', name: '武器工坊', stat: '初始武器', max: 4,  cost: l => [300, 900, 2000, 4000][l], val: l => l,          show: v => WEAPONS[v].name },
  { key: 'slots',    name: '多重武裝', stat: '同時裝備', max: 2,  cost: l => [1800, 7000][l],           val: l => 1 + l,      show: v => v + ' 把武器' },
  { key: 'air',      name: '空軍基地', stat: '轟炸支援', max: 5,  cost: l => [500, 1200, 2600, 5000, 9000][l], val: l => 320 - 30 * l, show: v => `每 ${v} m` },
];
const bld = k => BUILDINGS.find(b => b.key === k);

// ---------- save ----------
const SAVE_KEY = 'endless-legion-campaign-v1';
const freshSave = () => ({ coins: 0, unlocked: 1, best: {}, cleared: {}, up: {}, skins: [0], skin: 0 });
let save = loadSave();
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && typeof s === 'object') return Object.assign(freshSave(), s); } catch (e) {}
  return freshSave();
}
function persist() { if (simMode) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const upLv = k => save.up[k] || 0;
const upVal = k => bld(k).val(upLv(k));
const nextLevel = () => { for (let L = 1; L <= save.unlocked; L++) if (!save.cleared[L]) return L; return Math.min(LEVELS, save.unlocked); };

// ---------- difficulty ----------
// e = "effective distance": the level scales how far along the old endless curve each meter counts
const difficulty = e => 1 + e / 400 + Math.pow(e / 1100, 2);
const tierOf = e => Math.floor(e / 1000);
const effArmy = n => n <= 200 ? n : 200 * Math.pow(n / 200, 0.7);
const zoneOf = d => d < 3000 ? 0 : d < 4000 ? 1 : 2;
function effD(d) {
  const L = run ? run.L : 1;
  // the level's head start eases in over the first 1500 m so every level opens gently
  return d * (0.5 + 0.08 * (L - 1)) + 300 * (L - 1) * Math.min(1, d / 1500) + (d >= 3000 ? 300 : 0) + (d >= 4000 ? 400 : 0);
}
const scrollSpeed = d => Math.min(16, 9 + d / 700 + (run ? run.L * 0.08 : 0));
const KILL_COIN = { grunt: 1, runner: 1, spitter: 3, brute: 8, boss: 50 };
const ULT_GAIN = { grunt: 1, runner: 1, spitter: 3, brute: 8, boss: 40 };
const ultNeed = () => 1100 * (1 + 0.6 * tierOf(effD(traveled)));

// ---------- canvas / projection ----------
const cv = $('game'), ctx = cv.getContext('2d');
let W = 1, H = 1, F = 1, HOR = 0, HCAM = 1, CX = 0, camX = 0, backdrop = null;
function resize() {
  const r = cv.getBoundingClientRect();
  W = r.width || 1; H = r.height || 1;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W / 2; HOR = H * 0.22;
  VIEW_HALF = Math.min(HALF, 6.2);
  const playW = Math.min(W, H * 0.72);
  F = playW * 0.47 * ZOFF / VIEW_HALF;
  HCAM = (H * 0.48) * ZOFF / F;          // squad plane (z=0) sits at 70% of the screen height
  backdrop = null;
}
const S = z => F / (z + ZOFF);
function P(x, y, z) { const s = S(z); return [CX + (x - camX) * s, HOR + (HCAM - y) * s, s]; }

// ---------- state ----------
let state = 'menu', paused = false, simMode = false, run = null;
let traveled = 0, roadOff = 0, N = 5, peak = 5, arms = [0], armAcc = [0], dmgMul = 1, rateMul = 1, rangeMul = 1;
let sup = {}, supAcc = {}, planes = [], bombs = [], nextAir = 320;
let px = 0, targetX = 0, kills = 0, nextAt = 18, eventCount = 0, bossIdx = 0;
let shake = 0, redFlash = 0, rr = 0, gateStep = 1, boss = null, bossQueue = 0, nextBossSpawn = 0;
let monsters = [], bullets = [], gates = [], pickups = [], parts = [], texts = [], soldiers = [], shots = [];
let booms = [], arcs = [], beams = [], bolts = [], charge = 0, ultUses = 0, ult = null, whiteFlash = 0, critTextCd = 0, clock = 0;
const keys = {}, lossLog = {};

function resetRun() {

  sup = { missiles: 0, storm: 0, shield: 0, drones: 0 }; supAcc = { m: 0, s: 0, d: 0 }; planes = []; bombs = []; nextAir = upVal('air');
  dmgMul = upVal('armory'); rateMul = upVal('drill'); rangeMul = upVal('tower');
  px = targetX = camX = 0; kills = 0; nextAt = 18; eventCount = 0; bossIdx = 0;
  shake = redFlash = whiteFlash = 0; boss = null; bossQueue = 0; nextBossSpawn = 0;
  monsters = []; bullets = []; gates = []; pickups = []; parts = []; texts = []; soldiers = []; shots = [];
  booms = []; arcs = []; beams = []; bolts = []; charge = 0; ultUses = 0; ult = null;

}

function setRoad(L) { LANES = lanesOf(L); HALF = LANES * 2.5; resize(); }

// ---------- spawning ----------
const armPower = wi => { const w = WEAPONS[wi]; return w.dmg * w.pellets * w.rate; };
const bestArm = () => arms.reduce((b, a) => armPower(a) > armPower(b) ? a : b, arms[0]);
function playerDps() {
  const w = WEAPONS[bestArm()];
  // only power picked up during this run counts; base upgrades stay a real edge
  return effArmy(N) * w.dmg * w.pellets * w.rate * (dmgMul / run.base.dmg) * (rateMul / run.base.rate);
}
// hp: distance-based floor, or seconds of the squad's full fire (LV.2+), whichever is higher.
// power: soldiers lost on contact at full hp; from LV.2 on part of it is a share of the army.
function makeMonster(type, x, z, e) {
  const D = difficulty(e), t = tierOf(e), hpMul = 1 + 0.2 * t, dps = t > 0 ? playerDps() : 0;
  const m = { type, x, z, flash: 0, bob: Math.random() * 6, cd: rand(0.6, 1.4), hold: 0, slow: 0, burn: 0, burnDps: 0 };
  switch (type) {
    case 'boss':
      Object.assign(m, { r: 2.1, hp: Math.max(360 * D * hpMul, dps * (0.5 + 0.12 * t)), power: Math.max(45 * (1 + t), N * Math.min(0.22, 0.05 + 0.02 * t)), spd: 0.9, home: 0.4 });
      break;
    case 'brute':
      Object.assign(m, { r: 0.78, hp: Math.max(24 * D * hpMul, dps * 0.045 * (1 + 0.2 * t)), power: Math.max(6 * (1 + t), N * 0.0018 * t), spd: rand(1, 1.6), home: 0.5 });
      break;
    case 'runner':
      Object.assign(m, { r: 0.36, hp: Math.max(1.2 * D * hpMul, dps * 0.0015 * (1 + 0.2 * t)), power: 1 + t + N * 0.00045 * t, spd: rand(6, 8), home: 1.6 });
      break;
    case 'spitter':
      Object.assign(m, { r: 0.52, hp: Math.max(6 * D * hpMul, dps * 0.015 * (1 + 0.25 * t)), power: 2 + t, spd: rand(1.2, 1.8), home: 0.3, stopZ: rand(20, 28), stay: rand(5, 7) });
      break;
    default:
      Object.assign(m, { type: 'grunt', r: 0.44, hp: Math.max(2 * D * hpMul, dps * 0.002 * (1 + 0.25 * t)), power: 1 + t + N * 0.00045 * t, spd: rand(1.4, 2.6), home: 0.9 });
  }
  // early on, a small army faces weaker monsters so one bad gate isn't a dead run
  if (t === 0 && type !== 'boss') m.hp *= clamp(0.45 + N / 120, 0.45, 1);
  // later levels: tougher and harder-hitting enemies on top of the distance curve
  const L = run ? run.L : 1;
  m.hp *= 1 + 0.07 * (L - 1); m.power *= 1 + 0.03 * (L - 1);
  // waves are 2.5× bigger, so each regular monster is lighter
  if (type !== 'boss') m.hp *= 0.5;
  if (type === 'grunt' || type === 'runner') m.power *= 0.7;
  m.maxHp = m.hp;
  return m;
}

function spawnWave(e) {
  if (monsters.length > 600) return;
  const t = tierOf(e);
  const n = Math.min(400, Math.round((4 + e / 40 + rand(0, e < 300 ? 4 : 7)) * (1 + 0.22 * t) * (1 + 0.25 * (LANES - 2)) * 2.5));
  const bruteChance = e < 300 ? 0 : Math.min(0.2, 0.02 + e / 4000);
  const runnerChance = e < 300 ? 0 : Math.min(0.25, 0.05 + (e - 300) / 3000);

function gateSpec(good, e) {
  const t = tierOf(e);
  if (good) {
    if (Math.random() < 0.12 / (1 + 2 * t)) return { kind: 'mul', val: 2 };
    return { kind: 'add', val: Math.round(rand(3, 9) + e / 22 + (t ? N * rand(0.03, 0.07) : 0)) };

}

    if (p.kind === 'coins') p.val = Math.round((5 + 3 * run.L) * run.mods.vault);

function spawnEvents() {

    monsters.push(makeMonster('boss', rand(-1, 1) * Math.min(2, HALF - 2.5), SPAWN_Z + 4, e));
    bossQueue--;

  if (bossIdx < BOSS_AT.length && traveled >= BOSS_AT[bossIdx]) {

    return;
  }

    const bossOnRoad = bossQueue > 0 || monsters.some(m => m.type === 'boss');
    const r = Math.random();

    else if (r < 0.78) spawnGates(e);

// ---------- effects ----------
function burst(x, y, z, color, n, power = 4) {

}

  b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; bannerTimer = 1.8;

function loseSoldiers(n, src) {

  N -= n;

}

function applyGate(g) {

// ---------- run flow ----------
function startLevel(L) {

  if (m.type === 'spitter' && m.z <= m.stopZ && m.hold < m.stay && m.cd < 0.45) {
    ctx.globalAlpha = a * 0.6; ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = C.acid; ctx.beginPath(); ctx.arc(sx, y0 + 32 * k, 26 * k, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
  }
  if (m.type === 'brute' && m.hp < m.maxHp) {
    ctx.globalAlpha = a;
    const w = 70 * k, h = Math.max(3, 6 * k);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(sx - w / 2, y0 + 2 * k, w, h);
    ctx.fillStyle = '#ff5d5d'; ctx.fillRect(sx - w / 2, y0 + 2 * k, w * Math.max(0, m.hp / m.maxHp), h);
  }
  ctx.globalAlpha = 1;
}

function gateLabel(g) {
  if (g.kind === 'mul') return '×' + g.val;
  if (g.kind === 'div') return '÷' + g.val;
  return (g.val >= 0 ? '+' : '−') + fmt(Math.abs(g.val));
}
function gateGood(g) { return g.kind === 'mul' || (g.kind === 'add' && g.val > 0); }
function drawGate(g) {
  const a = fade(g.z) * clamp((g.z + 2.5) / 2.5, 0, 1); if (a <= 0) return;
  g.sides.forEach((side, i) => {
    const x0 = -HALF + 5 * i, x1 = x0 + 5;
    ctx.globalAlpha = a * (g.done && i !== g.chosen ? 0.3 : 1);
    const tl = P(x0 + .18, 2.7, g.z), br = P(x1 - .18, 0.1, g.z), s = tl[2], w = br[0] - tl[0], h = br[1] - tl[1];
    const rgb = gateGood(side) ? C.good : C.bad;
    const gr = ctx.createLinearGradient(0, tl[1], 0, br[1]);
    gr.addColorStop(0, `rgba(${rgb},.78)`); gr.addColorStop(1, `rgba(${rgb},.22)`);
    ctx.fillStyle = gr; ctx.fillRect(tl[0], tl[1], w, h);
    const step = Math.max(4, s * .2);
    ctx.fillStyle = 'rgba(255,255,255,.09)';
    for (let y = tl[1] + step - ((clock * 40) % step); y < br[1]; y += step) ctx.fillRect(tl[0], y, w, Math.max(1, s * .03));
    const post = Math.max(3, s * .16);
    ctx.fillStyle = `rgb(${rgb})`; ctx.fillRect(tl[0], tl[1] - post * .4, w, post * .8);
    for (const x of [tl[0] - post / 2, br[0] - post / 2]) {
      const pg = ctx.createLinearGradient(x, 0, x + post, 0); pg.addColorStop(0, '#dfe5ee'); pg.addColorStop(.5, '#9aa4b4'); pg.addColorStop(1, '#5d6676');
      ctx.fillStyle = pg; ctx.fillRect(x, tl[1] - post * .6, post, h + post * .6);
    }
    const fsz = Math.max(9, s * 1.2);
    ctx.font = `${fsz}px Bungee, "Noto Sans TC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const tx = tl[0] + w / 2, ty = tl[1] + h * .48, label = gateLabel(side);
    ctx.lineWidth = Math.max(3, fsz * .2); ctx.strokeStyle = 'rgba(10,14,26,.85)'; ctx.strokeText(label, tx, ty);
    ctx.fillStyle = '#fff'; ctx.fillText(label, tx, ty);
  });
  ctx.globalAlpha = 1;
}

function drawGunIcon(cx, cy, s, w) {
  const len = 0.9 + Math.min(0.5, WEAPONS.indexOf(w) * 0.05);
  ctx.fillStyle = C.ink;
  ctx.fillRect(cx - s * .55 * len, cy - s * .13, s * 1.1 * len, s * .26);
  ctx.fillRect(cx - s * .08, cy, s * .22, s * .4);
  ctx.fillStyle = w.color === '#ffffff' ? '#7fdcff' : w.color;
  ctx.fillRect(cx + s * .3 * len, cy - s * .2, s * .22, s * .1);
  if (w.fx === 'rocket' || w.fx === 'missile') { ctx.beginPath(); ctx.arc(cx + s * .58 * len, cy, s * .16, 0, TAU); ctx.fill(); }
}
function drawPickup(p) {
  const a = fade(p.z) * clamp((p.z + 2) / 2, 0, 1); if (a <= 0) return;
  ctx.globalAlpha = a;
  const [gx, gy, gs] = P(p.x, 0.02, p.z);
  const sp = SUPPORT_PICKS[p.kind];
  const col = p.kind === 'weapon' ? '255,210,63' : p.kind === 'coins' ? '255,190,40' : sp ? sp.color : '98,227,255';
  ctx.strokeStyle = `rgba(${col},.85)`; ctx.lineWidth = Math.max(1.5, gs * .07);
  ctx.beginPath(); ctx.ellipse(gx, gy, gs * 1.0, gs * .36, 0, 0, TAU); ctx.stroke();
  const beam = ctx.createLinearGradient(0, gy - gs * 2.4, 0, gy);
  beam.addColorStop(0, `rgba(${col},0)`); beam.addColorStop(1, `rgba(${col},.32)`);
  ctx.fillStyle = beam; ctx.fillRect(gx - gs * .8, gy - gs * 2.4, gs * 1.6, gs * 2.4);
  const hover = 1.15 + Math.sin(p.spin) * .15;
  const [sx, sy, s] = P(p.x, hover, p.z), r = .72 * s;
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(sx, sy, r * 1.1, 0, TAU); ctx.fill();
  const og = ctx.createRadialGradient(sx - r * .35, sy - r * .4, r * .1, sx, sy, r);
  og.addColorStop(0, '#ffffff'); og.addColorStop(.35, `rgb(${col})`); og.addColorStop(1, `rgba(${col},.75)`);
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
  let label;
  if (p.kind === 'weapon') { const w = WEAPONS[p.wi]; drawGunIcon(sx, sy - r * .1, r, w); label = `${w.name}・${w.tag}`; }
  else {
    label = sp ? `${sp.label} ${sp.dur} 秒` : { power: '火力 +25%', rate: '射速 +15%', range: '射程 +15%', coins: `金幣 +${p.val}` }[p.kind];
    ctx.font = `900 ${Math.max(8, r * .95)}px "Noto Sans TC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.ink; ctx.fillText(sp ? sp.glyph : { power: '力', rate: '速', range: '遠', coins: '金' }[p.kind], sx, sy + r * .04);
  }
  const fsz = Math.max(9, s * .42);
  ctx.font = `900 ${fsz}px "Noto Sans TC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.lineWidth = fsz * .28; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.strokeText(label, sx, sy + r * 1.25);
  ctx.fillStyle = '#fff'; ctx.fillText(label, sx, sy + r * 1.25);
  ctx.globalAlpha = 1;
}

function shotY(s) { const k = clamp(1 - s.z / s.z0, 0, 1); return 0.6 + Math.sin(k * Math.PI) * 2.4; }
function drawShot(s) {
  drawShadow(s.x, s.z, .25);
  const [sx, sy, sc] = P(s.x, shotY(s), s.z), r = Math.max(2, .28 * sc);
  ctx.fillStyle = 'rgba(157,255,74,.35)'; ctx.beginPath(); ctx.arc(sx, sy, r * 1.7, 0, TAU); ctx.fill();
  ctx.fillStyle = C.acid; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
}

function drawSoldier(s) {
  const x = px + s.ox, z = s.oz;
  const [sx, sy, sc] = P(x, 0, z), w = .68 * sc, h = w * 1.5;
  const bob = Math.abs(Math.sin(s.ph * 0.5)) * h * .04;
  ctx.drawImage(soldierSprite(save.skin, Math.floor(s.ph / 1.6) % 4), sx - w / 2, sy - h * 68 / 72 - bob, w, h);
}

function strokeLine(a, b) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function drawBullets() {
  ctx.lineCap = 'round';
  for (const b of bullets) {
    const w = b.w, a = P(b.x, .55, b.z), s = a[2];
    switch (w.fx) {
      case 'rocket': case 'missile': {
        const sp = Math.hypot(b.vx, b.vz) || 1;
        const t = P(b.x - b.vx / sp * .6, .55, b.z - b.vz / sp * .6);
        ctx.strokeStyle = w.fx === 'missile' ? '#f4f4f4' : '#e6e6e6'; ctx.lineWidth = Math.max(2, s * (w.fx === 'missile' ? .12 : .16)); strokeLine(a, t);
        ctx.fillStyle = w.color; ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(2, s * .1), 0, TAU); ctx.fill();
        ctx.fillStyle = 'rgba(255,150,40,.85)'; ctx.beginPath(); ctx.arc(t[0], t[1], Math.max(1.5, s * .08), 0, TAU); ctx.fill();
        break;
      }
      case 'laser': {
        const t = P(b.x, .55, b.z - 3);
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(77,243,255,.45)'; ctx.lineWidth = Math.max(3, s * .16); strokeLine(a, t);
        ctx.strokeStyle = '#e8fdff'; ctx.lineWidth = Math.max(1.2, s * .04); strokeLine(a, t);
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'flame': {
        const k = 1 - b.life / b.max;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.max(0, 0.85 - k * 0.75);
        ctx.fillStyle = k < .35 ? '#ffd23f' : k < .7 ? '#ff7a1a' : '#e0391f';
        ctx.beginPath(); ctx.arc(a[0], a[1] - k * s * .4, Math.max(2, s * (.12 + k * .38)), 0, TAU); ctx.fill();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'plasma': {
        ctx.fillStyle = 'rgba(199,125,255,.35)'; ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(4, s * .38), 0, TAU); ctx.fill();
        ctx.fillStyle = w.color; ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(3, s * .2), 0, TAU); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(1.5, s * .08), 0, TAU); ctx.fill();
        break;
      }
      case 'pellet': {
        ctx.fillStyle = w.color; ctx.beginPath(); ctx.arc(a[0], a[1], Math.max(1.5, s * (w.fan ? .09 : .07)), 0, TAU); ctx.fill();
        break;
      }
      default: {
        ctx.strokeStyle = w.color; ctx.lineWidth = Math.max(1.5, s * .08); strokeLine(a, P(b.x - b.vx * .02, .55, b.z - .9));
      }
    }
  }
}

function drawBolt(x0, y0, x1, y1, seed, width) {
  ctx.beginPath(); ctx.moveTo(x0, y0);
  const n = 9;
  for (let i = 1; i < n; i++) { const k = i / n; ctx.lineTo(x0 + (x1 - x0) * k + (hash(seed + i) - .5) * 38 * (1 - Math.abs(k - .5)), y0 + (y1 - y0) * k); }
  ctx.lineTo(x1, y1);
  ctx.strokeStyle = 'rgba(120,220,255,.55)'; ctx.lineWidth = width * 3; ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = width; ctx.stroke();
}
function drawFx() {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const b of booms) {
    const k = 1 - b.life / b.max, [sx, sy, s] = P(b.x, 0.05, b.z), r = b.r * s * (0.35 + k);
    ctx.globalAlpha = (1 - k) * .45; ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(sx, sy - r * .35, r * .65, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = b.color; ctx.lineWidth = Math.max(2, s * .2 * (1 - k));
    ctx.beginPath(); ctx.ellipse(sx, sy, r, r * .38, 0, 0, TAU); ctx.stroke();
  }
  for (const a of arcs) {
    const p0 = P(a.x0, a.y0, a.z0), p1 = P(a.x1, a.y1, a.z1);
    ctx.globalAlpha = Math.min(1, a.life / .1); ctx.strokeStyle = '#efe0ff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]);
    for (let i = 1; i < 6; i++) { const k = i / 6, j = 10 * (Math.random() - .5); ctx.lineTo(p0[0] + (p1[0] - p0[0]) * k + j, p0[1] + (p1[1] - p0[1]) * k + j); }
    ctx.lineTo(p1[0], p1[1]); ctx.stroke();
  }
  for (const b of beams) {
    const p0 = P(b.x, .55, b.z0), p1 = P(b.x, .55, Math.min(b.z1, SPAWN_Z + 6)), k = b.life / .16;
    for (const [wd, col] of [[.32, 'rgba(150,215,255,.35)'], [.1, 'rgba(255,255,255,.95)']]) {
      ctx.globalAlpha = k; ctx.fillStyle = col; ctx.beginPath();
      ctx.moveTo(p0[0] - p0[2] * wd, p0[1]); ctx.lineTo(p1[0] - p1[2] * wd, p1[1]); ctx.lineTo(p1[0] + p1[2] * wd, p1[1]); ctx.lineTo(p0[0] + p0[2] * wd, p0[1]);
      ctx.closePath(); ctx.fill();
    }
  }
  for (const b of bolts) {
    const [sx, sy] = P(b.x, b.y, b.z);
    ctx.globalAlpha = Math.min(1, b.life / .2);
    drawBolt(sx + (hash(b.seed) - .5) * 60, -20, sx, sy, b.seed, 3);
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(sx, sy, 14 * ctx.globalAlpha + 4, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// sigil + darkening while 天罰降臨 charges and strikes
function drawUltOverlay() {
  if (!ult) return;
  const t = ult.t;
  const dark = t < 0.55 ? t / 0.55 : t < 1.5 ? 1 : Math.max(0, 1 - (t - 1.5) / 0.5);
  const vg = ctx.createRadialGradient(W / 2, H * .6, H * .1, W / 2, H * .6, H * .9);
  vg.addColorStop(0, `rgba(10,14,50,${.25 * dark})`); vg.addColorStop(1, `rgba(4,6,24,${.75 * dark})`);
  ctx.fillStyle = vg; ctx.fillRect(-40, -40, W + 80, H + 80);
  const [sx, sy, s] = P(px, 0.05, 0.2);
  const grow = Math.min(1, t / 0.5), R = s * (1.6 + grow * 2.6);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = dark;
  ctx.translate(sx, sy); ctx.scale(1, 0.36);
  ctx.strokeStyle = '#7fe7ff'; ctx.lineWidth = 4; ctx.shadowColor = '#4df3ff'; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, R * .8, 0, TAU); ctx.stroke();
  ctx.strokeStyle = '#ffe07a';
  for (const dir of [1, -1]) {
    ctx.beginPath();
    for (let i = 0; i <= 3; i++) { const a = dir * t * 1.8 + i * TAU / 3 + (dir < 0 ? Math.PI / 3 : 0); const x = Math.cos(a) * R * .8, y = Math.sin(a) * R * .8; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.fillStyle = '#bff6ff';
  for (let i = 0; i < 16; i++) { const a = -t * 1.2 + i * TAU / 16; ctx.fillRect(Math.cos(a) * R * .9 - 3, Math.sin(a) * R * .9 - 3, 6, 6); }
  ctx.restore();
  if (t < 0.6) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 28; i++) {
      const a = hash(i) * TAU, d = (1 - ((t / 0.55 + hash(i * 3)) % 1)) * R * 1.4;
      ctx.fillStyle = i % 2 ? '#7fe7ff' : '#ffe07a'; ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.arc(sx + Math.cos(a) * d, sy - 20 + Math.sin(a) * d * .5, 2.5, 0, TAU); ctx.fill();
    }
    const pg = ctx.createLinearGradient(sx, 0, sx, sy);
    pg.addColorStop(0, 'rgba(127,231,255,0)'); pg.addColorStop(1, `rgba(127,231,255,${.5 * grow})`);
    ctx.fillStyle = pg; ctx.fillRect(sx - s * .6 * grow, 0, s * 1.2 * grow, sy);
    ctx.restore();
  }
}

function drawSquadLabel() {
  if (!soldiers.length || state === 'menu') return;
  const R = squadRadius();
  const [sx, sy] = P(px, 1.35, R * .55 + .3);
  const txt = fmt(N);
  ctx.font = '20px Bungee, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 24;
  ctx.fillStyle = SKINS[save.skin].uniD; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(sx - w / 2, sy - 15, w, 30, 15); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(txt, sx, sy + 1);
}

function render() {
  ctx.save();
  if (shake > 0.3 && !reduceMotion) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawSky();
  drawGround();
  const items = [];
  propItems(items);
  for (const g of gates) items.push([g.z, drawGate, g]);
  for (const m of monsters) items.push([m.z, drawMonster, m]);
  for (const p of pickups) items.push([p.z, drawPickup, p]);
  for (const s of shots) items.push([s.z, drawShot, s]);
  for (const s of soldiers) items.push([s.oz, drawSoldier, s]);
  items.sort((a, b) => b[0] - a[0]);
  // all monster and soldier shadows in one fill
  ctx.fillStyle = 'rgba(0,0,0,.24)'; ctx.beginPath();
  const addShadow = (x, z, r) => { const [sx, sy, s] = P(x, 0, z), rx = r * s; if (rx < 1.5) return; ctx.moveTo(sx + rx, sy); ctx.ellipse(sx, sy, rx, rx * .35, 0, 0, TAU); };
  for (const m of monsters) if (m.z < SPAWN_Z) addShadow(m.x, m.z, m.r * 1.05);
  for (const s of soldiers) addShadow(px + s.ox, s.oz, .24);
  ctx.fill();
  for (const [, fn, o] of items) fn(o);
  drawDronesAndShield();
  drawBullets();
  drawAir();
  drawFx();
  for (const p of parts) {
    const [sx, sy, s] = P(p.x, p.y, p.z);
    ctx.globalAlpha = clamp(p.life / p.max * 1.4, 0, 1); ctx.fillStyle = p.color;
    const r = Math.max(1, p.size * s); ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  for (const t of texts) {
    const [sx, sy] = P(t.x, t.y, t.z), fsz = 28 * t.size;
    ctx.globalAlpha = clamp(t.life * 1.5, 0, 1);
    ctx.font = `${fsz}px Bungee, "Noto Sans TC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.strokeText(t.text, sx, sy);
    ctx.fillStyle = t.color; ctx.fillText(t.text, sx, sy);
  }
  ctx.globalAlpha = 1;
  drawSquadLabel();
  const th = curTheme();
  const hz = ctx.createLinearGradient(0, HOR - 2, 0, HOR + H * 0.1);
  hz.addColorStop(0, `rgba(${th.haze},.9)`); hz.addColorStop(1, `rgba(${th.haze},0)`);
  ctx.fillStyle = hz; ctx.fillRect(-30, HOR - 2, W + 60, H * 0.1 + 2);
  drawUltOverlay();
  ctx.restore();
  if (redFlash > 0) { ctx.fillStyle = `rgba(239,68,68,${redFlash * 0.55})`; ctx.fillRect(0, 0, W, H); }
  if (whiteFlash > 0) { ctx.fillStyle = `rgba(235,250,255,${Math.min(1, whiteFlash) * 0.85})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- HUD ----------
let hudCache = '';
function updateHud() {
  if (!run || state === 'menu') return;
  const d = Math.min(LEVEL_LEN, Math.floor(traveled)), coins = Math.round(run.coinKill) + run.coinTrip;
  const air = Math.max(0, Math.ceil(nextAir - traveled));
  const key = [d, coins, arms.join(','), dmgMul, rateMul, rangeMul, air, ...Object.values(sup).map(Math.ceil)].join('|');
  if (key !== hudCache) {
    hudCache = key;
    $('hDist').textContent = fmt(d);
    $('progFill').style.width = (d / LEVEL_LEN * 100).toFixed(2) + '%';
    const z = zoneOf(d), hz = $('hZone');
    hz.textContent = ['普通', '中等難度', '高難度'][z]; hz.className = 'z' + z;
    $('hCoins').textContent = fmt(coins);
    $('wname').textContent = arms.length > 1 ? arms.map(a => WEAPONS[a].name).join(' ＋ ') : `${WEAPONS[arms[0]].name}・${WEAPONS[arms[0]].tag}`;
    $('buffs').innerHTML = Object.entries(sup).filter(([, v]) => v > 0).map(([k, v]) => `<div class="pill buff">${SUPPORT_PICKS[k].label} <b>${Math.ceil(v)}s</b></div>`).join('')
      + (traveled < LEVEL_LEN - 150 ? `<div class="pill buff air">轟炸機 <b>${air} m</b></div>` : '');
    $('wpow').textContent = '×' + dmgMul.toFixed(2).replace(/\.?0+$/, '');
    $('wrate').textContent = '×' + rateMul.toFixed(2).replace(/\.?0+$/, '');
    $('wrange').textContent = '×' + rangeMul.toFixed(2).replace(/\.?0+$/, '');
  }
  const ready = charge >= 1 && state === 'play';
  $('ultArc').style.strokeDashoffset = (276.46 * (1 - charge)).toFixed(1);
  const ub = $('ultBtn');
  if (ub.classList.contains('ready') !== ready) ub.classList.toggle('ready', ready);
  $('ultPct').textContent = ready ? '雙擊施放' : Math.floor(charge * 100) + '%';
  const bb = $('bossbar');
  if (boss && state === 'play') {
    bb.hidden = false; $('bossfill').style.width = Math.max(0, boss.hp / boss.maxHp * 100) + '%';
    const more = bossQueue + monsters.filter(m => m.type === 'boss').length - 1;
    $('bosslabel').textContent = more > 0 ? `BOSS　後面還有 ${more} 隻` : 'BOSS';
  } else if (!bb.hidden) bb.hidden = true;
}

// ---------- screens ----------
const SCREENS = ['scrHub', 'scrLevels', 'scrBase', 'scrSquad', 'scrResult', 'scrPause'];
function showScreen(id) {
  for (const s of SCREENS) $(s).hidden = s !== id;
  $('hud').hidden = !(run && (state === 'play' || id === 'scrPause'));
}
function toMenu() {
  state = 'menu'; run = null; paused = false;
  setRoad(1);
  monsters = []; bullets = []; gates = []; pickups = []; shots = []; booms = []; arcs = []; beams = []; bolts = []; texts = [];
  N = 14; soldiers = []; px = targetX = camX = 0; ult = null;
  $('bossbar').hidden = true; $('banner').hidden = true;
}
function openHub() {
  toMenu();
  const L = nextLevel(), cleared = Object.keys(save.cleared).length;
  $('hubCoins').textContent = fmt(save.coins);
  $('hubCleared').textContent = cleared;
  $('hubSquad').textContent = SKINS[save.skin].name;
  $('hubPlay').textContent = cleared >= LEVELS ? `再戰 · 第 ${L} 關` : `出征 · 第 ${L} 關`;
  $('hubPlay').dataset.level = L;
  showScreen('scrHub');
}
const SVG_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
const SVG_LOCK = '<svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function openLevels() {
  const nl = nextLevel();
  let html = '';
  for (let w = 0; w < 4; w++) {
    const th = THEMES[w], from = w * 5 + 1, lanes = [...new Set([0, 1, 2, 3, 4].map(i => lanesOf(from + i)))].join('–');
    html += `<div class="world"><div class="world-head"><b>${th.name}</b><span>第 ${from}–${from + 4} 關 · ${lanes} 線道</span></div><div class="lv-grid">`;
    for (let L = from; L < from + 5; L++) {
      const locked = L > save.unlocked, best = save.best[L] || 0;
      html += `<button class="lv${locked ? ' locked' : ''}${L === nl && !locked ? ' next' : ''}" type="button" ${locked ? 'disabled aria-disabled="true"' : `data-act="play" data-level="${L}"`}
        style="background:linear-gradient(160deg, ${th.sky[1]}, ${th.sky[0]} 55%, ${th.hills[1]})" aria-label="第 ${L} 關">
        ${save.cleared[L] ? `<span class="ck">${SVG_CHECK}</span>` : ''}${locked ? SVG_LOCK : `<span class="n">${L}</span><span class="b">${best ? fmt(best) + ' m' : '未挑戰'}</span>`}</button>`;
    }
    html += '</div></div>';
  }
  $('levelList').innerHTML = html;
  showScreen('scrLevels');
}
function openBase() {
  $('baseCoins').textContent = fmt(save.coins);
  $('baseList').innerHTML = BUILDINGS.map(b => {
    const l = upLv(b.key), max = l >= b.max, cost = max ? 0 : Math.round(b.cost(l));
    const pips = Array.from({ length: b.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
    return `<div class="bld"><div class="bld-top"><div class="bld-ico"><svg viewBox="0 0 24 24">${ICON[b.key]}</svg></div>
      <div><div class="bld-name">${b.name}</div><div class="bld-lv">Lv.${l} / ${b.max}</div></div></div>
      <div class="pips">${pips}</div>
      <div class="bld-stat">${b.stat}　<b>${b.show(b.val(l))}</b>${max ? '' : `　<span class="to">→ ${b.show(b.val(l + 1))}</span>`}</div>
      <button class="btn ${max ? 'ghost' : 'primary'} small" type="button" data-act="upgrade" data-key="${b.key}" ${max || save.coins < cost ? 'disabled' : ''}>
        ${max ? '已滿級' : `<i class="coin"></i><span class="num">${fmt(cost)}</span>　升級`}</button></div>`;
  }).join('');
  showScreen('scrBase');
}
function openSquads() {
  $('squadCoins').textContent = fmt(save.coins);
  $('squadList').innerHTML = SKINS.map((k, i) => {
    const owned = save.skins.includes(i), sel = save.skin === i;
    const btn = sel ? `<button class="btn ghost small" type="button" disabled>出征中</button>`
      : owned ? `<button class="btn ghost small" type="button" data-act="skin" data-i="${i}">選用</button>`
      : `<button class="btn primary small" type="button" data-act="skin" data-i="${i}" ${save.coins < k.price ? 'disabled' : ''}><i class="coin"></i><span class="num">${fmt(k.price)}</span>　解鎖</button>`;
    return `<div class="sq${sel ? ' sel' : ''}"><canvas width="320" height="160" data-skin="${i}"></canvas><div class="sq-name">${k.name}</div><div class="sq-desc">${k.desc}</div>${btn}</div>`;
  }).join('');
  for (const c of $('squadList').querySelectorAll('canvas')) {
    const i = +c.dataset.skin, g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.3)';
    for (const [x, y, s, f] of [[70, 150, 1.35, 1], [250, 150, 1.35, 3], [160, 154, 1.7, 0]]) {
      g.beginPath(); g.ellipse(x, y, 30 * s, 8 * s, 0, 0, TAU); g.fill();
      g.drawImage(soldierSprite(i, f), x - 24 * s * 1.15, y - 68 * s * 1.15, 48 * s * 1.15, 72 * s * 1.15);
    }
  }
  showScreen('scrSquad');
}
function showResult() {
  if (!run) return;
  const win = state === 'clear', L = run.L;
  const next = win && L < LEVELS;
  $('resultBody').innerHTML = `
    <div class="res-title ${win ? 'win' : 'lose'}">${win ? '關卡完成！' : '軍團全滅'}</div>
    <div class="res-sub">第 ${L} 關 · ${run.theme.name}${run.newBest && !win ? '<span class="tagline">新紀錄</span>' : ''}${win && run.firstClear ? '<span class="tagline">首次通關</span>' : ''}</div>
    <div class="res-stats">
      <div><div class="k">距離</div><div class="v">${fmt(run.dist)}</div></div>
      <div><div class="k">擊殺</div><div class="v">${fmt(kills)}</div></div>
      <div><div class="k">最大兵力</div><div class="v">${fmt(peak)}</div></div>
    </div>
    <div class="ledger">
      <div><span>擊殺獎金</span><b>${fmt(run.coinKill)}</b></div>
      <div><span>過程獎金（里程・金幣道具）</span><b>${fmt(run.coinTrip)}</b></div>
      <div><span>通關獎金${win && run.firstClear ? '（首次 ×1.5）' : ''}</span><b>${fmt(run.coinClear)}</b></div>
      <div class="total"><span>本次獲得</span><b><i class="coin"></i>${fmt(run.total)}</b></div>
    </div>
    <div class="res-actions">
      ${next ? `<button class="btn primary" type="button" data-act="play" data-level="${L + 1}">下一關 · 第 ${L + 1} 關</button>` : `<button class="btn primary" type="button" data-act="retry">${win ? '再玩一次' : '再試一次'}</button>`}
      <div class="row"><button class="btn ghost" type="button" data-act="base">升級基地</button><button class="btn ghost" type="button" data-act="hub">返回主畫面</button></div>
    </div>`;
  showScreen('scrResult');
}
function setPaused(p) {
  if (state !== 'play') return;
  paused = p;
  $('pauseSub').textContent = `第 ${run.L} 關 · ${fmt(Math.floor(traveled))} m`;
  showScreen(p ? 'scrPause' : null);
}

$('wrap').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === 'play') startLevel(+b.dataset.level || nextLevel());
  else if (act === 'levels') openLevels();
  else if (act === 'base') { if (state !== 'menu') toMenu(); openBase(); }
  else if (act === 'squad') openSquads();
  else if (act === 'hub') openHub();
  else if (act === 'retry') startLevel(run ? run.L : nextLevel());
  else if (act === 'resume') setPaused(false);
  else if (act === 'pause') setPaused(true);
  else if (act === 'quit') { paused = false; state = 'menu'; openHub(); }
  else if (act === 'ult') castUlt();
  else if (act === 'upgrade') {
    const bd = bld(b.dataset.key), l = upLv(bd.key), cost = Math.round(bd.cost(l));
    if (l < bd.max && save.coins >= cost) { save.coins -= cost; save.up[bd.key] = l + 1; persist(); openBase(); }
  } else if (act === 'skin') {
    const i = +b.dataset.i, k = SKINS[i];
    if (!save.skins.includes(i)) { if (save.coins < k.price) return; save.coins -= k.price; save.skins.push(i); }
    save.skin = i; persist(); openSquads();
  }
});

// ---------- input ----------
function pointerTo(clientX) {
  if (state !== 'play' || paused) return;
  const r = cv.getBoundingClientRect();
  targetX = (clientX - r.left - CX) / S(0) + camX;
}
let lastTap = 0;
cv.addEventListener('pointermove', e => pointerTo(e.clientX));
cv.addEventListener('pointerdown', e => {
  pointerTo(e.clientX);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const now = performance.now();
  if (now - lastTap < 320) { castUlt(); lastTap = 0; } else lastTap = now;   // double click / double tap
});
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); castUlt(); }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && state === 'play') setPaused(!paused);
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !paused) setPaused(true); });
addEventListener('resize', resize);

// ---------- test hooks ----------
// __legionDebug.jump(12, 3000, 2000, 7): level 12 from 3000 m with 2000 soldiers and the homing missiles
window.__legionDebug = {
  jump(L, d, n, wi) { startLevel(L); traveled = d; N = peak = n; if (wi != null) arms = [wi]; nextAir = d + 60; nextAt = d + 5; run.nextMile = Math.ceil((d + 1) / 1000) * 1000; run.zone = zoneOf(d); bossIdx = BOSS_AT.filter(b => b < d).length; },
  charge() { charge = 1; },
  support(k, t = 10) { sup[k] = t; },
  bomber() { callBomber(); },
  give(wi) { gainWeapon(wi); },
  money(n) { save.coins += n; persist(); },
  state: () => ({ L: run && run.L, d: Math.floor(traveled), N, monsters: monsters.length, state, lossLog }),
  // headless run of one level, steered by a simple player bot, with the given upgrades
  simLevel(L, up) {
    const keep = save; simMode = true;
    save = Object.assign(freshSave(), { up: { ...up } });
    startLevel(L);
    let steps = 0;
    while (state === 'play' && steps < 30 * 900) { botThink(); update(1 / 30); steps++; }
    const r = { L, cleared: state === 'clear', d: Math.floor(traveled), coins: run.total, kill: Math.round(run.coinKill), trip: run.coinTrip, clear: run.coinClear, kills, peak, ult: ultUses, weapon: arms.map(a => WEAPONS[a].name).join('+'), lossLog: { ...lossLog } };
    save = keep; simMode = false; state = 'menu'; run = null;
    return r;
  },
  perf: () => ({ update: perf.u.toFixed(1), render: perf.r.toFixed(1), monsters: monsters.length, bullets: bullets.length, parts: parts.length }),
  BUILDINGS, LEVELS,
};
// takes the best gate, grabs upgrades, otherwise steps to the spot with the least threat
function botThink() {
  if (charge >= 1 && (monsters.some(m => m.type === 'boss' && m.z < 30) || monsters.filter(m => m.z < 30).length > 30)) castUlt();
  const result = s => s.kind === 'add' ? N + s.val : s.kind === 'mul' ? N * s.val : Math.ceil(N / s.val);
  const g = gates.find(g => !g.done && g.z > 0 && g.z < 22);
  if (g) { let bi = 0; g.sides.forEach((s, i) => { if (result(s) > result(g.sides[bi])) bi = i; }); targetX = laneX(bi); return; }
  const ps = pickups.filter(p => !p.taken && p.z > 0 && p.z < 22);
  if (ps.length) {
    const w = ps.find(p => p.kind === 'weapon');
    const better = w && (armPower(w.wi) > armPower(arms.reduce((a, b) => armPower(a) < armPower(b) ? a : b)) || arms.length < run.slots) && !arms.includes(w.wi);
    const pick = better ? w : ps.find(p => p.kind === 'power') || ps.find(p => p.kind !== 'weapon') || ps[0];
    targetX = pick.x; return;
  }
  let bestX = px, bestS = Infinity;
  for (let x = -HALF + 2; x <= HALF - 2 + 1e-6; x += 1.5) {
    let sc = Math.abs(x - px) * 0.05;
    for (const m of monsters) if (m.z > 0 && m.z < 24) sc += (m.hp / m.maxHp) * m.power / (0.6 + Math.abs(m.x - x));
    if (sc < bestS) { bestS = sc; bestX = x; }
  }
  targetX = bestX;
}

// ---------- loop ----------
let last = performance.now();
const perf = { u: 0, r: 0 };
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t0 = performance.now();
  if (!paused) update(dt);
  const t1 = performance.now();
  render(); updateHud();
  const t2 = performance.now();
  perf.u = perf.u * .9 + (t1 - t0) * .1; perf.r = perf.r * .9 + (t2 - t1) * .1;
  requestAnimationFrame(frame);
}
resize();
openHub();
requestAnimationFrame(frame);
})();
</script>
